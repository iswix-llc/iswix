name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The SDK comes from global.json; IsWiX runs on .NET 8.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # The standalone app and the designers' .NET 8 builds. The extension builds what it hosts itself.
      - name: Build IsWiX
        run: dotnet build IsWiX.sln -c Release

      - name: Build the extension
        run: msbuild IsWiXExtension.sln -restore -p:Configuration=Release "-p:Platform=Any CPU" -v:minimal

      - name: Upload the VSIX
        uses: actions/upload-artifact@v7
        with:
          name: IsWiX-vsix
          path: IsWiXExtension/bin/Release/IsWiX.vsix
          if-no-files-found: error
