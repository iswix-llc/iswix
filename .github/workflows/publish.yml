name: Publish the VSIX

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # The SDK comes from global.json; IsWiX runs on .NET 8.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The version lives in Directory.Build.props (app and designers), the VSIX manifest (the Marketplace version)
      # and the extension's AssemblyInfo.cs; all three move together.
      - name: Increment the version
        id: version
        shell: pwsh
        run: |
          $props = 'Directory.Build.props'
          $text = [IO.File]::ReadAllText($props)
          if ($text -notmatch '<Version>(\d+)\.(\d+)\.(\d+)</Version>') { throw 'No <Version> element found.' }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          switch ('${{ inputs.bump }}') {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            'patch' { $patch++ }
          }
          $new = "$major.$minor.$patch"
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($props, ($text -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$new</Version>"), $utf8)

          $manifest = 'IsWiXExtension/source.extension.vsixmanifest'
          $text = [IO.File]::ReadAllText($manifest)
          if ($text -notmatch '(<Identity [^>]*Version=")\d+\.\d+\.\d+\.\d+"') { throw 'No Identity Version in the VSIX manifest.' }
          [IO.File]::WriteAllText($manifest, ($text -replace '(<Identity [^>]*Version=")\d+\.\d+\.\d+\.\d+"', "`${1}$new.0`""), $utf8)

          $assemblyInfo = 'IsWiXExtension/Properties/AssemblyInfo.cs'
          $text = [IO.File]::ReadAllText($assemblyInfo)
          $text = $text -replace 'AssemblyVersion\("\d+\.\d+\.\d+\.\d+"\)', "AssemblyVersion(`"$new.0`")"
          $text = $text -replace 'AssemblyFileVersion\("\d+\.\d+\.\d+\.\d+"\)', "AssemblyFileVersion(`"$new.0`")"
          [IO.File]::WriteAllText($assemblyInfo, $text, (New-Object Text.UTF8Encoding($true)))

          "version=$new" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $new"

      - name: Build IsWiX
        run: dotnet build IsWiX.sln -c Release

      # The VSIX packs the app from IsWiXExtension\IsWiX, which FolderProfile publishes to.
      - name: Publish IsWiX into the extension
        run: dotnet publish IsWiX/IsWiX.csproj -c Release -p:PublishProfile=FolderProfile

      - name: Sign in to Azure (federated identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The sign CLI signs both the assemblies and the VSIX (a package, which signtool-based signing can't do),
      # with the same Artifact Signing account and profile as IsWiX.WiXModel.
      - name: Install the sign CLI
        run: dotnet tool install --global sign --version 0.9.1-beta.26475.3

      # Only IsWiX's own assemblies; third-party ones (Xceed, DiffPlex, WixToolset.Dtf) keep their publishers'
      # signatures, and IsWiX.WiXModel is signed when it is published to NuGet.
      - name: Sign IsWiX's assemblies (Artifact Signing)
        shell: pwsh
        run: |
          $files = 'IsWiX.exe', 'IsWiX.dll', 'FireworksFramework.dll',
            'CustomTablesDesigner.dll', 'FeaturesDesigner.dll', 'FilesAndFoldersDesigner.dll', 'GeneralInformationDesigner.dll',
            'NamespacesDesigner.dll', 'PropertiesDesigner.dll', 'ServicesDesigner.dll', 'ShortCutsDesigner.dll'
          sign code artifact-signing @files `
            --base-directory "$env:GITHUB_WORKSPACE\IsWiXExtension\IsWiX" `
            --artifact-signing-endpoint https://eus.codesigning.azure.net/ `
            --artifact-signing-account ISWIX-LLC `
            --artifact-signing-certificate-profile IsWiX `
            --azure-credential-type azure-cli `
            --verbosity warning
          if ($LASTEXITCODE -ne 0) { throw 'Signing the assemblies failed.' }

      - name: Build the extension
        run: msbuild IsWiXExtension.sln -restore -p:Configuration=Release "-p:Platform=Any CPU" -v:minimal

      - name: Sign the VSIX (Artifact Signing)
        shell: pwsh
        run: |
          sign code artifact-signing IsWiXExtension/bin/Release/IsWiX.vsix `
            --artifact-signing-endpoint https://eus.codesigning.azure.net/ `
            --artifact-signing-account ISWIX-LLC `
            --artifact-signing-certificate-profile IsWiX `
            --azure-credential-type azure-cli `
            --verbosity warning
          if ($LASTEXITCODE -ne 0) { throw 'Signing the VSIX failed.' }

      - name: Commit and tag the release
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props IsWiXExtension/source.extension.vsixmanifest IsWiXExtension/Properties/AssemblyInfo.cs
          git commit -m "Release $v"
          if ($LASTEXITCODE -ne 0) { throw 'Committing the version bump failed.' }
          git tag -a "v$v" -m "Release $v"
          if ($LASTEXITCODE -ne 0) { throw "Tagging v$v failed." }
          # Push the branch and the tag by name, together: --follow-tags alone skips lightweight tags,
          # and --atomic keeps main and the tag from diverging if either is rejected.
          git push --atomic origin main "refs/tags/v$v"
          if ($LASTEXITCODE -ne 0) { throw "Pushing main and v$v failed." }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Copy-Item IsWiXExtension/bin/Release/IsWiX.vsix "IsWiX-$v.vsix"
          gh release create "v$v" "IsWiX-$v.vsix" --title "IsWiX $v" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Creating the v$v release failed." }
